name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *' # 每天台灣時間 06:00 更新資料
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Refresh event snapshot (失敗時沿用 repo 內的舊快照)
        run: node demo/snapshot.mjs || echo "::warning::快照更新失敗，沿用 repo 內舊資料"
      - name: Fetch news (失敗時沿用舊檔)
        run: node scripts/fetch-news.mjs
      - name: Build
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
